<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Control Forgot Password</title>
    <style>
        :root {
            --page-bg: #0d1117;
            --panel: #161b22;
            --panel-soft: #202632;
            --text: #eef2f6;
            --muted: #acb3bd;
            --line: #303a45;
            --accent: #ff4d4d;
            --accent-2: #ffd166;
            --shadow: rgba(0,0,0,.35);
            --danger: #ff9b9b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Avenir Next', 'Helvetica Neue', 'Montserrat', 'Arial', sans-serif;
            margin: 0;
            color: var(--text);
            background: var(--page-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .auth-shell {
            width: min(460px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 12px 30px var(--shadow);
            padding: 28px;
        }
        h1 { margin-top: 0; color: var(--accent-2); font-size: 30px; }
        p { color: var(--muted); }
        form { display: flex; flex-direction: column; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
        input { padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-soft); color: var(--text); }
        button { background: var(--accent); color: #fff; font-weight: 900; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #cc0000; }
        .links { margin-top: 16px; color: var(--muted); font-size: 13px; }
        .links a { color: var(--accent-2); text-decoration: none; }
        .error { color: var(--danger); background: #351616; border: 1px solid var(--danger); border-radius: 8px; padding: 10px; margin-bottom: 14px; }
        .message { color: var(--good, #71f0a8); }
    </style>
</head>
<body>
    <div class="auth-shell">
        <h1>Reset Password</h1>
        <p>Enter your email to start a password reset.</p>
        {% if message %}
        <div class="message">{{ message }}</div>
        {% endif %}
        {% if reset_link %}
        <div class="message">Local reset link: <a href="{{ reset_link }}">{{ reset_link }}</a></div>
        {% endif %}
        <form method="POST" action="/forgot_password">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit">Send Reset Link</button>
        </form>
        <div class="links">
            <a href="/login">Back to Login</a>
        </div>
    </div>
</body>
</html>
