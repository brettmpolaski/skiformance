<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Control Login</title>
    <style>
        :root {
            --page-bg: #0d1117;
            --panel: #161b22;
            --panel-soft: #202632;
            --text: #eef2f6;
            --muted: #acb3bd;
            --line: #303a45;
            --accent: #ff4d4d;
            --accent-2: #ffd166;
            --shadow: rgba(0,0,0,.35);
            --danger: #ff9b9b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Avenir Next', 'Helvetica Neue', 'Montserrat', 'Arial', sans-serif;
            margin: 0;
            color: var(--text);
            background: var(--page-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .auth-shell {
            width: min(420px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 12px 30px var(--shadow);
            padding: 28px;
        }
        h1 { margin-top: 0; color: var(--accent-2); font-size: 30px; }
        p { color: var(--muted); }
        form { display: flex; flex-direction: column; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
        input { padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-soft); color: var(--text); }
        button { background: var(--accent); color: #fff; font-weight: 900; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #cc0000; }
        .links { margin-top: 16px; color: var(--muted); font-size: 13px; }
        .links a { color: var(--accent-2); text-decoration: none; }
        .error { color: var(--danger); background: #351616; border: 1px solid var(--danger); border-radius: 8px; padding: 10px; margin-bottom: 14px; }
    </style>
</head>
<body>
    <div class="auth-shell">
        <h1>Garage Control</h1>
        <p>Sign in to your garage.</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Enter Garage</button>
        </form>
        <div class="links">
            No account yet? <a href="/register">Create one</a><br>
            Forgot your password? <a href="/forgot_password">Reset it</a>
        </div>
    </div>
</body>
</html>
