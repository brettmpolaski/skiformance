<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Control</title>
    <style>
        :root {
            --page-bg: #0d1117;
            --panel: #161b22;
            --panel-soft: #202632;
            --text: #eef2f6;
            --muted: #acb3bd;
            --line: #303a45;
            --accent: #ff4d4d;
            --accent-2: #ffd166;
            --shadow: rgba(0,0,0,.35);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Avenir Next', 'Helvetica Neue', 'Montserrat', 'Arial', sans-serif;
            margin: 0;
            color: var(--text);
            background: var(--page-bg);
            min-height: 100vh;
            padding: 24px;
        }
        .shell { max-width: 1200px; margin: 0 auto; }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--line);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--accent);
            color: #fff;
            font-weight: 900;
            font-size: 20px;
            box-shadow: 0 0 0 1px var(--accent);
        }
        .brand h1 { margin: 0; font-size: 28px; color: var(--text); }
        .tagline { color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
        .layout {
            display: grid;
            grid-template-columns: 280px minmax(460px, 1fr);
            gap: 24px;
        }
        .sidebar {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 20px;
        }
        .content {
            background: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 24px;
        }
        .panel-title {
            color: var(--accent-2);
            font-size: 14px;
            letter-spacing: .14em;
            text-transform: uppercase;
        }
        .garage-list a {
            color: var(--text);
            text-decoration: none;
            display: block;
            border-bottom: 1px solid var(--line);
            padding: 12px 0;
        }
        .garage-list a:hover { color: var(--accent-2); }
    </style>
</head>
<body>
    <div class="shell">
        <div class="topbar">
            <div class="brand">
                <div class="brand-mark">G</div>
                <div>
                    <h1>Garage Control</h1>
                    <div class="tagline">Private Garage</div>
                </div>
            </div>
            <div>
                <a href="/logout" class="back-btn" style="color:white;text-decoration:none;">Logout</a>
            </div>
        </div>
        <section class="layout">
            <aside class="sidebar">
                <div class="panel-title">Garage</div>
                <div class="garage-list">
                    <a href="#">Garage Overview</a>
                    <a href="#">Fleet</a>
                    <a href="#">Budget</a>
                    <a href="#">Parts</a>
                </div>
            </aside>
            <main class="content">
                <p class="panel-title">Garage Layout</p>
                <div style="display:flex;justify-content:center;align-items:center;min-height:360px;">
                    <svg viewBox="0 0 500 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
                        <rect x="40" y="40" width="420" height="180" rx="8" fill="#202632" stroke="#303a45" />
                        <ellipse cx="250" cy="210" rx="150" ry="45" fill="none" stroke="#ffd166" stroke-width="2" />
                        <path d="M130 120 L160 100 L200 105 L210 140 L160 142 L120 130 Z" fill="#ff4d4d" opacity="0.85" />
                        <path d="M240 105 L270 95 L310 105 L330 140 L280 140 L230 125 Z" fill="#71f0a8" opacity="0.7" />
                        <path d="M180 150 L210 150 L220 165 L190 165 Z" fill="#ffd166" opacity="0.85" />
                        <path d="M260 150 L320 150 L330 165 L270 165 Z" fill="#ffd166" opacity="0.85" />
                        <circle cx="160" cy="180" r="8" fill="#eef2f6" />
                        <circle cx="330" cy="180" r="8" fill="#eef2f6" />
                    </svg>
                </div>
            </main>
        </section>
    </div>
</body>
</html>
